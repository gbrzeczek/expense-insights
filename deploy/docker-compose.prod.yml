# Production stack on the home server: db + api + caddy (TLS), reachable only via Tailscale.
# See deploy/README.md. Values come from deploy/.env, which the Deploy workflow writes from the
# GitHub environment `production` (variables listed in deploy/.env.prod.example).
#
# The Deploy workflow builds the images, pushes them to GHCR tagged with the commit, and runs
# deploy/scripts/deploy.sh on the server, which pulls them. `build:` stays for building from a
# checkout instead (IMAGE_TAG unset → `local`):
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
name: expense-insights-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Postgres with pgvector preinstalled, so plan 07 needs no image change.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_insights}
      POSTGRES_USER: ${POSTGRES_USER:-expense_insights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    # No published port: backups run pg_dump inside the container.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/gbrzeczek/expense-insights:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-expense_insights};Username=${POSTGRES_USER:-expense_insights};Password=${POSTGRES_PASSWORD}
      Auth__OwnerEmail: ${AUTH_OWNER_EMAIL:?set AUTH_OWNER_EMAIL in deploy/.env}
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in deploy/.env}
      Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in deploy/.env}
      # Caddy terminates TLS; trust its X-Forwarded-Proto so redirect URIs and cookies are https.
      # Safe because the API port is only reachable from Caddy and from the server itself.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    # Loopback only, for deploy.sh's health check and debugging on the server.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # 1 GB, not 512 MB: the embedding model (plan 07) adds ~270 MB while it's loaded, during
    # classification only; it's unloaded after 2 minutes idle.
    mem_limit: 1g
    logging: *logging

  caddy:
    build: caddy
    image: ghcr.io/gbrzeczek/expense-insights-caddy:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST in deploy/.env}
      TLS_MODE: ${TLS_MODE:-acme}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    # Bound to the server's Tailscale address only: nothing listens on the LAN or the internet.
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in deploy/.env}:443:443"
      - "${TAILSCALE_IP}:443:443/udp"
      - "${TAILSCALE_IP}:80:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
