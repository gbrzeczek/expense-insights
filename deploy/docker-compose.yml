# Development stack. Production hardening (secrets, tunnel, backups) comes in plan 05.
#
#   docker compose -f deploy/docker-compose.yml up -d                # db only
#   docker compose -f deploy/docker-compose.yml --profile api up -d  # db + api from the prod image
#
# Values come from deploy/.env (copy deploy/.env.example); the defaults match
# src/backend/ExpenseInsights.Api/appsettings.Development.json.
name: expense-insights

services:
  db:
    # Postgres with pgvector preinstalled, so plan 07 needs no image change.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_insights}
      POSTGRES_USER: ${POSTGRES_USER:-expense_insights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [api]
    build:
      context: ..
      dockerfile: Dockerfile
    image: expense-insights:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-expense_insights};Username=${POSTGRES_USER:-expense_insights};Password=${POSTGRES_PASSWORD:-dev_only_password}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
