name: CI

# PRs are built via pull_request; push builds only main so a PR push doesn't run twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    # A normal run takes about 3 minutes; this only stops a hang the hang dump below misses.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/Directory.Packages.props', 'src/backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests start Postgres with Testcontainers (Docker is available on the runner).
      # A test project still running after 5 minutes is dumped and fails, naming the tests that
      # were still running.
      - run: dotnet test --no-build -c Release --hangdump --hangdump-timeout 5m --hangdump-type Mini --results-directory "$PWD/TestResults"

      - name: Show hung tests
        if: failure()
        run: cat TestResults/*_hang.log 2>/dev/null || echo "No test hung."

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hang-dumps
          path: |
            src/backend/TestResults/*_hang.log
            src/backend/TestResults/*.dmp
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (lint + test + build + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          retention-days: 7

  deploy:
    name: Deploy files (shellcheck + compose + Caddy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x -P deploy/scripts deploy/scripts/*.sh deploy/systemd/install.sh
      - name: Production compose config
        env:
          POSTGRES_PASSWORD: ci
          AUTH_OWNER_EMAIL: ci@example.com
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          APP_HOST: expenses.example.com
          TAILSCALE_IP: 127.0.0.1
        run: docker compose -f deploy/docker-compose.prod.yml config -q
      - name: Build Caddy and validate the Caddyfile
        run: |
          docker build -t expense-insights-caddy:ci deploy/caddy
          for mode in acme internal; do
            docker run --rm --network none -e APP_HOST=expenses.example.com -e TLS_MODE="$mode" \
              -e ACME_EMAIL=ci@example.com -e CLOUDFLARE_API_TOKEN="$(printf 'x%.0s' {1..40})" \
              expense-insights-caddy:ci caddy validate --config /etc/caddy/Caddyfile
          done

  image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: expense-insights:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size
        run: |
          docker create --name size-probe expense-insights:ci >/dev/null
          size=$(docker export size-probe | wc -c)
          echo "Unpacked image size: $((size / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          # 400 MB since plan 07: the embedding model (~135 MB) and ONNX Runtime (~30 MB) are built in (D33).
          test "$size" -lt $((400 * 1024 * 1024))
